<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Password Setup - Nixor Portal</title>
  <link rel="stylesheet" href="/assets/app.css" />
  <script src="/assets/theme-init.js"></script>
</head>

<body
  class="bg-[var(--bg-base)] text-[var(--text-primary)] min-h-screen flex items-center justify-center p-4 selection:bg-[var(--color-primary)] selection:text-white">
  <main class="card w-full max-w-md p-8 md:p-10 mx-auto">
    <div class="mb-8 text-center">
      <div class="w-12 h-12 rounded-xl bg-[var(--text-primary)] flex items-center justify-center mx-auto mb-6 shadow-sm">
        <svg class="w-6 h-6 text-[var(--bg-base)]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
            d="M9 12l2 2 4-4m5 2a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
      </div>
      <p class="text-[10px] text-[var(--text-tertiary)] uppercase tracking-[0.2em] font-bold mb-3">Nixor Corporate
        Portal</p>
      <h1 id="reset-title" class="text-2xl font-bold tracking-tight mb-2">Set a new password</h1>
      <p id="reset-subtitle" class="text-sm text-[var(--text-secondary)]">Choose a strong password for your account.</p>
    </div>

    <form id="reset-password-form" class="space-y-4" novalidate>
      <div class="space-y-1.5">
        <label for="password-input" class="block text-sm font-medium text-[var(--text-secondary)]">New password</label>
        <input id="password-input" type="password" name="password" autocomplete="new-password" class="input-field"
          required />
      </div>
      <div class="space-y-1.5">
        <label for="confirm-input" class="block text-sm font-medium text-[var(--text-secondary)]">Confirm password</label>
        <input id="confirm-input" type="password" name="password_confirmation" autocomplete="new-password"
          class="input-field" required />
      </div>
      <ul id="password-requirements" class="text-xs text-[var(--text-secondary)] space-y-1">
        <li data-rule="length">At least 12 characters</li>
        <li data-rule="uppercase">One uppercase letter</li>
        <li data-rule="lowercase">One lowercase letter</li>
        <li data-rule="number">One number</li>
        <li data-rule="symbol">One symbol</li>
        <li data-rule="match">Passwords match</li>
      </ul>
      <div id="reset-status" role="status" aria-live="polite"
        class="hidden text-sm rounded-lg px-4 py-3 border border-[var(--border-subtle)]"></div>
      <button type="submit" class="btn btn-primary w-full py-2.5">Update password</button>
    </form>

    <p class="text-[11px] text-[var(--text-tertiary)] text-center mt-8">
      <a id="reset-login-link"
        class="hover:text-[var(--text-secondary)] underline decoration-[var(--border-subtle)] underline-offset-4"
        href="/login.html">Back to sign in</a>
      <span aria-hidden="true"> · </span>
      <a id="legal-privacy" class="hover:text-[var(--text-secondary)] underline decoration-[var(--border-subtle)] underline-offset-4"
        href="/privacy.html">Privacy</a>
      <span aria-hidden="true"> · </span>
      <a id="legal-terms" class="hover:text-[var(--text-secondary)] underline decoration-[var(--border-subtle)] underline-offset-4"
        href="/terms.html">Terms</a>
    </p>
  </main>
  <script type="module" src="/assets/reset_password.js"></script>
</body>

</html>
