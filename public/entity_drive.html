<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entity Drive</title>
  <link rel="stylesheet" href="/assets/app.css" />
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div class="flex">
    <aside class="w-64 min-h-screen bg-slate-900 border-r border-slate-800 p-6 hidden lg:block">
      <div class="text-xs uppercase tracking-[0.3em] text-indigo-300">Nixor Portal</div>
      <nav class="mt-8 space-y-2 text-sm">
        <a class="block px-3 py-2 rounded-xl hover:bg-slate-800" href="/dashboard.html">Entity Dashboard</a>
        <a class="block px-3 py-2 rounded-xl hover:bg-slate-800" href="/entity_endeavours.html">Entity Endeavours</a>
        <a class="block px-3 py-2 rounded-xl bg-slate-900 text-white" href="/entity_drive.html">Entity Drive</a>
      </nav>
    </aside>
    <main class="flex-1 p-6 md:p-8">
      <header class="flex flex-col xl:flex-row xl:items-center xl:justify-between gap-4">
        <div>
          <h1 class="text-2xl font-semibold">Entity Drive</h1>
          <p id="drive-breadcrumbs" class="text-sm text-slate-400 mt-1"></p>
        </div>
        <div class="flex flex-wrap gap-3">
          <select id="drive-entity" class="bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-sm"></select>
          <button id="new-folder" class="bg-slate-900 border border-slate-800 rounded-xl px-4 py-2 text-sm">New Folder</button>
          <button id="new-link" class="bg-slate-900 border border-slate-800 rounded-xl px-4 py-2 text-sm">New Link</button>
          <button id="upload-file" class="bg-indigo-500 rounded-xl px-4 py-2 text-sm">Upload File</button>
        </div>
      </header>

      <section class="mt-8 grid grid-cols-1 xl:grid-cols-[1.1fr_2fr_1.1fr] gap-6">
        <div class="space-y-4">
          <h2 class="text-sm font-semibold text-slate-300">Quick Access</h2>
          <div id="drive-summary" class="grid grid-cols-1 sm:grid-cols-3 xl:grid-cols-1 gap-4"></div>
          <div id="drive-status" class="text-xs text-slate-500"></div>
        </div>

        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6">
          <div class="flex items-center justify-between mb-4">
            <h2 class="text-sm font-semibold text-slate-300">Items</h2>
            <div id="drive-count" class="text-xs text-slate-500">Showing 0 items</div>
          </div>
          <div class="overflow-x-auto">
            <table class="w-full text-sm">
              <thead class="text-slate-500">
                <tr>
                  <th class="text-left py-2">Name</th>
                  <th class="text-left py-2">Sharing</th>
                  <th class="text-left py-2">Size</th>
                  <th class="text-left py-2">Modified</th>
                  <th class="text-left py-2">Actions</th>
                </tr>
              </thead>
              <tbody id="drive-list" class="text-slate-200"></tbody>
            </table>
          </div>
        </div>

        <aside class="bg-slate-900 border border-slate-800 rounded-2xl p-6">
          <h2 class="text-sm font-semibold text-slate-300">Inspector</h2>
          <div id="inspector-preview" class="mt-4 min-h-36 bg-slate-950 border border-slate-800 rounded-xl p-3 flex items-center justify-center text-xs text-slate-500">Preview</div>
          <h3 id="inspector-name" class="text-lg font-semibold mt-4">Select a file</h3>
          <p id="inspector-meta" class="text-xs text-slate-500"></p>
          <div class="mt-4 flex gap-2">
            <a id="inspector-open" class="hidden inline-flex text-xs bg-slate-800 px-3 py-2 rounded-xl" target="_blank" rel="noopener noreferrer">Open external</a>
            <a id="inspector-download" class="hidden inline-flex text-xs bg-indigo-500 px-3 py-2 rounded-xl">Download</a>
          </div>
        </aside>
      </section>
    </main>
  </div>

  <input id="upload-input" type="file" class="hidden" />
  <script type="module" src="/assets/entity_drive.js"></script>
</body>
</html>
