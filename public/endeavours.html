<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Volunteering</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/assets/app.css" />
</head>

<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div class="flex">
    <div id="sidebar-container"></div>
    <main class="flex-1 p-6 md:p-10">
      <header class="flex flex-col lg:flex-row lg:items-end justify-between gap-6 mb-8">
        <div>
          <div class="flex items-center gap-3">
            <h1 class="text-2xl font-bold tracking-tight">Volunteering Opportunities</h1>
            <span id="notification-badge"
              class="hidden text-xs px-2 py-1 rounded border bg-amber-500/10 border-amber-500/20 text-amber-400 font-medium"></span>
          </div>
          <p class="text-slate-400 mt-1 text-sm">Find and register for endeavours across entities.</p>
        </div>
        <div class="flex flex-col sm:flex-row gap-3 w-full lg:w-auto">
          <div class="relative flex-1 sm:w-72">
            <svg class="w-5 h-5 absolute left-3 top-1/2 -translate-y-1/2 text-slate-500" fill="none" viewBox="0 0 24 24"
              stroke="currentColor" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
            </svg>
            <label for="search-input" class="sr-only">Search events</label>
            <input id="search-input" placeholder="Search events..." class="input-field pl-10" />
          </div>
          <div class="relative">
            <label for="entity-filter" class="sr-only">Filter by Entity</label>
            <select id="entity-filter" class="input-field sm:w-48"></select>
          </div>
        </div>
      </header>
      <section id="endeavour-grid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6 animate-fade-in">
      </section>
      <div id="endeavour-empty"
        class="hidden flex flex-col items-center justify-center py-16 text-center card border-dashed border-slate-700 mt-8">
        <svg class="w-12 h-12 text-slate-600 mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
        </svg>
        <h3 class="text-lg font-medium text-slate-300">No opportunities found</h3>
        <p class="text-sm text-slate-500 mt-1 max-w-sm">No volunteering opportunities align with your search. Try
          changing the filters above.</p>
      </div>
    </main>
  </div>
  <script type="module" src="/assets/endeavours.js"></script>
</body>

</html>
