<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Volunteering</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/assets/app.css" />
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div class="flex">
    <aside class="w-64 min-h-screen bg-slate-900 border-r border-slate-800 p-6 hidden md:block">
      <div class="text-xs uppercase tracking-[0.3em] text-indigo-300">Nixor Portal</div>
      <nav class="mt-8 space-y-2 text-sm">
        <a class="block px-3 py-2 rounded-xl hover:bg-slate-800" href="/dashboard.html">Entity Dashboard</a>
        <a class="block px-3 py-2 rounded-xl hover:bg-slate-800" href="/entity_endeavours.html">Entity Endeavours</a>
        <a class="block px-3 py-2 rounded-xl hover:bg-slate-800" href="/entity_drive.html">Entity Drive</a>
        <a class="block px-3 py-2 rounded-xl hover:bg-slate-800" href="/calendar.html">Calendar</a>
        <a class="block px-3 py-2 rounded-xl hover:bg-slate-800" href="/social.html">Social</a>
        <a class="block px-3 py-2 rounded-xl bg-slate-900 text-white" href="/endeavours.html">Volunteering</a>
        <a class="block px-3 py-2 rounded-xl hover:bg-slate-800" href="/admin.html">Settings</a>
      </nav>
    </aside>
    <main class="flex-1 p-6 md:p-10">
      <header class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
        <div>
          <div class="flex items-center gap-3">
            <h1 class="text-2xl font-semibold">Volunteering</h1>
            <span id="notification-badge" class="hidden text-xs px-2 py-1 rounded-full bg-amber-500/20 text-amber-300"></span>
          </div>
          <p class="text-slate-400">Register for endeavours with open volunteer registration.</p>
        </div>
        <div class="flex flex-col md:flex-row gap-3 w-full md:w-auto">
          <input id="search-input" placeholder="Search by endeavour or entity" class="bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-sm w-full md:w-64" />
          <select id="entity-filter" class="bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-sm"></select>
        </div>
      </header>
      <section id="endeavour-grid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6 mt-8"></section>
      <p id="endeavour-empty" class="hidden text-sm text-slate-400 mt-6">No endeavours match the selected filters.</p>
    </main>
  </div>
  <script type="module">
    import { apiFetch } from '/assets/app.js';
    const searchInput = document.getElementById('search-input');
    const entityFilter = document.getElementById('entity-filter');
    const grid = document.getElementById('endeavour-grid');
    const emptyState = document.getElementById('endeavour-empty');
    const notificationBadge = document.getElementById('notification-badge');

    const renderEndeavours = (rows) => {
      grid.innerHTML = '';
      if (!rows.length) {
        emptyState.classList.remove('hidden');
        return;
      }
      emptyState.classList.add('hidden');
      rows.forEach((row) => {
        const card = document.createElement('div');
        card.className = 'bg-slate-900 border border-slate-800 rounded-2xl p-6 flex flex-col';
        const header = document.createElement('div');
        header.className = 'flex items-center justify-between';
        const status = document.createElement('span');
        status.className = 'text-xs px-2 py-1 rounded-full bg-emerald-500/10 text-emerald-300';
        status.textContent = 'Volunteer Registration Open';
        header.appendChild(status);
        const title = document.createElement('h2');
        title.className = 'text-lg font-semibold mt-4';
        title.textContent = row.name;
        const desc = document.createElement('p');
        desc.className = 'text-sm text-slate-400 mt-2';
        desc.textContent = row.description || 'No description provided.';
        const meta = document.createElement('div');
        meta.className = 'mt-4 text-xs text-slate-500 space-y-1';
        const dates = document.createElement('p');
        const fmtDate = (value) => value ? new Date(value).toLocaleDateString(undefined, { dateStyle: 'medium' }) : 'TBD';
        dates.textContent = `Dates: ${fmtDate(row.event_start_at || row.start_date)} – ${fmtDate(row.event_end_at || row.end_date)}`;
        const entity = document.createElement('p');
        entity.textContent = `Entity: ${row.entity_name}`;
        const deadline = document.createElement('p');
        deadline.textContent = `Registration deadline: ${fmtDate(row.volunteer_registration_deadline)}`;
        meta.appendChild(dates);
        meta.appendChild(entity);
        meta.appendChild(deadline);
        const actions = document.createElement('div');
        actions.className = 'mt-6 flex flex-col gap-2';
        const registerButton = document.createElement('button');
        registerButton.className = 'bg-indigo-500 text-sm px-4 py-2 rounded-xl text-center disabled:opacity-60';
        registerButton.textContent = row.registered ? 'Registered' : 'Register';
        registerButton.disabled = row.registered;
        const registerError = document.createElement('p');
        registerError.className = 'text-xs text-red-300 hidden';
        registerButton.addEventListener('click', async () => {
          if (registerButton.disabled) return;
          registerButton.disabled = true;
          registerError.classList.add('hidden');
          registerButton.textContent = 'Registering...';
          try {
            await apiFetch(`/endeavours/${row.id}/register`, { method: 'POST', body: JSON.stringify({}) });
            registerButton.textContent = 'Registered';
            registerButton.disabled = true;
          } catch (err) {
            registerButton.textContent = 'Register';
            registerButton.disabled = false;
            registerError.textContent = err?.message || 'Unable to register. Please try again.';
            registerError.classList.remove('hidden');
          }
        });
        actions.appendChild(registerButton);
        actions.appendChild(registerError);
        const view = document.createElement('a');
        view.href = `/endeavour_view.html?id=${row.id}`;
        view.className = 'bg-slate-800 text-sm px-4 py-2 rounded-xl text-center';
        view.textContent = 'View';
        actions.appendChild(view);
        card.appendChild(header);
        card.appendChild(title);
        card.appendChild(desc);
        card.appendChild(meta);
        card.appendChild(actions);
        grid.appendChild(card);
      });
    };

    const loadEndeavours = async () => {
      const params = new URLSearchParams();
      if (entityFilter.value) params.set('entity_id', entityFilter.value);
      if (searchInput.value) params.set('q', searchInput.value);
      try {
        const response = await apiFetch(`/endeavours/volunteering?${params.toString()}`);
        renderEndeavours(response?.data || []);
      } catch (err) {
        grid.innerHTML = '';
        emptyState.textContent = 'Failed to load endeavours. Please try again.';
        emptyState.classList.remove('hidden');
      }
    };

    const loadNotifications = async () => {
      try {
        const response = await apiFetch('/notifications');
        const unread = response?.meta?.unread || 0;
        if (unread > 0) {
          notificationBadge.textContent = `${unread} new`;
          notificationBadge.classList.remove('hidden');
        } else {
          notificationBadge.classList.add('hidden');
        }
      } catch (err) {
        notificationBadge.classList.add('hidden');
      }
    };

    let searchTimer;
    apiFetch('/auth/me')
      .then((response) => {
        const entities = response?.data?.entities || [];
        entityFilter.innerHTML = '<option value=\"\">All Entities</option>';
        entities.forEach((entity) => {
          const option = document.createElement('option');
          option.value = entity.id;
          option.textContent = entity.name;
          entityFilter.appendChild(option);
        });
        loadEndeavours();
        loadNotifications();
      })
      .catch(() => {
        entityFilter.innerHTML = '<option value=\"\">All Entities</option>';
        console.error('Failed to load user entities');
        loadEndeavours();
        loadNotifications();
      });

    entityFilter.addEventListener('change', loadEndeavours);
    searchInput.addEventListener('input', () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(loadEndeavours, 250);
    });
  </script>
</body>
</html>
