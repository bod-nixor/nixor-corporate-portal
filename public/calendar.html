<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <!-- Theme Init Script to prevent FOUC -->
  <script src="/assets/theme-init.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calendar</title>
  <link rel="stylesheet" href="/assets/app.css" />
</head>

<body
  class="bg-[var(--bg-base)] text-[var(--text-primary)] min-h-screen selection:bg-[var(--text-secondary)] selection:text-[var(--bg-base)]">
  <div class="flex w-full min-h-screen">
    <div id="sidebar-container" class="shrink-0"></div>
    <main class="flex-1 p-5 md:p-8 lg:p-10 min-w-0 max-w-7xl mx-auto">
      <header class="mb-10 pb-6 border-b border-[var(--border-subtle)]">
        <h1 id="calendar-heading" class="text-3xl font-bold tracking-tight">Calendar</h1>
        <p class="text-[var(--text-secondary)] mt-1.5 text-sm font-medium">Meetings, deadlines, RSVPs, and minutes.</p>
      </header>

      <section class="mt-6 grid grid-cols-1 xl:grid-cols-[2fr_1fr] gap-8 animate-fade-in">
        <div
          class="card p-0 overflow-hidden shadow-sm border-[var(--border-strong)] bg-[rgba(255,255,255,0.02)] xl:min-h-[500px]">
          <div class="px-6 py-5 border-b border-[var(--border-subtle)] flex items-center justify-between">
            <h2 class="text-lg font-bold tracking-tight text-[var(--text-primary)]">Upcoming Events</h2>
            <label for="calendar-entity" class="sr-only">Select entity</label>
            <select id="calendar-entity" aria-labelledby="calendar-heading"
              class="input-field max-w-[200px] py-1.5 text-sm font-medium bg-[var(--bg-surface)]"></select>
          </div>
          <div class="p-6">
            <div id="calendar-list" class="space-y-4"></div>
            <div id="calendar-empty" class="hidden text-center py-12">
              <span
                class="inline-flex h-12 w-12 items-center justify-center rounded-full bg-[var(--bg-surface-hover)] border border-[var(--border-subtle)] text-[var(--text-tertiary)] mb-4">
                <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                </svg>
              </span>
              <p data-empty-heading class="text-sm font-semibold text-[var(--text-secondary)]">No events scheduled.</p>
              <p data-empty-subtext class="text-xs text-[var(--text-tertiary)] mt-1">Select a different entity or create
                a new event.</p>
            </div>
          </div>
        </div>

        <div class="card p-0 overflow-hidden shadow-sm border-[var(--border-strong)] bg-[rgba(255,255,255,0.02)] h-fit">
          <div class="px-6 py-5 border-b border-[var(--border-subtle)]">
            <h2 class="text-lg font-bold tracking-tight text-[var(--text-primary)]">Add Event</h2>
          </div>
          <form id="calendar-form" class="p-6 space-y-5 bg-[var(--bg-surface)]">
            <div class="space-y-1.5">
              <label for="calendar-title"
                class="block text-xs font-bold text-[var(--text-secondary)] uppercase tracking-wider">Event
                Title</label>
              <input id="calendar-title" name="title" required placeholder="Quarterly Review"
                class="input-field font-medium w-full" />
            </div>
            <div class="space-y-1.5">
              <label for="calendar-event-date"
                class="block text-xs font-bold text-[var(--text-secondary)] uppercase tracking-wider">Date &
                Time</label>
              <input id="calendar-event-date" name="event_date" type="datetime-local" required
                class="input-field font-medium w-full" />
            </div>
            <div class="space-y-1.5">
              <label for="calendar-location"
                class="block text-xs font-bold text-[var(--text-secondary)] uppercase tracking-wider">Location</label>
              <input id="calendar-location" name="location" placeholder="e.g. Conference Room A"
                class="input-field font-medium w-full" />
            </div>
            <div class="space-y-1.5">
              <label for="calendar-description"
                class="block text-xs font-bold text-[var(--text-secondary)] uppercase tracking-wider">Description</label>
              <textarea id="calendar-description" name="description" rows="3" placeholder="Additional details..."
                class="input-field font-medium w-full resize-y"></textarea>
            </div>

            <div id="calendar-status"
              class="hidden text-sm rounded-lg px-4 py-3 font-medium border border-[var(--border-subtle)]"></div>

            <div class="pt-2">
              <button class="btn btn-primary w-full shadow-sm" type="submit">Create Event</button>
            </div>
          </form>
        </div>
      </section>
    </main>
  </div>
  <script type="module">
    import { apiFetch } from '/assets/app.js';
    import { renderSidebar } from '/assets/sidebar.js';

    document.getElementById('sidebar-container').outerHTML = renderSidebar('calendar');
    const entitySelect = document.getElementById('calendar-entity');
    const list = document.getElementById('calendar-list');
    const emptyState = document.getElementById('calendar-empty');
    const form = document.getElementById('calendar-form');
    const statusEl = document.getElementById('calendar-status');

    // Store default empty-state text so it can be restored after errors
    const defaultEmptyHeading = emptyState.querySelector('[data-empty-heading]')?.textContent || 'No events scheduled.';
    const defaultEmptySubtext = emptyState.querySelector('[data-empty-subtext]')?.textContent || 'Select a different entity or create a new event.';

    const normalizeError = (err) => {
      const message = err?.message || '';
      return message === 'Forbidden' ? 'You do not have permission.' : (message || 'Action failed.');
    };

    const setStatus = (message, ok) => {
      statusEl.textContent = message;
      statusEl.className = `text-sm font-semibold rounded-lg px-4 py-3 ${ok ? 'bg-[rgba(16,185,129,0.1)] text-[#6ee7b7] border-[rgba(16,185,129,0.2)]' : 'bg-[rgba(239,68,68,0.1)] text-[#fca5a5] border-[rgba(239,68,68,0.2)]'}`;
      statusEl.classList.remove('hidden');
    };

    const loadEvents = async () => {
      const entityId = entitySelect.value;
      if (!entityId) return;
      try {
        const response = await apiFetch(`/calendar?entity_id=${entityId}`);
        const events = response?.data || [];
        list.innerHTML = '';
        if (!events.length) {
          // Restore default text (in case a previous error overwrote it)
          emptyState.querySelector('[data-empty-heading]').textContent = defaultEmptyHeading;
          emptyState.querySelector('[data-empty-subtext]').textContent = defaultEmptySubtext;
          emptyState.classList.remove('hidden');
          return;
        }
        emptyState.classList.add('hidden');
        events.forEach((event) => {
          const card = document.createElement('div');
          card.className = 'bg-[var(--bg-surface)] border border-[var(--border-subtle)] rounded-xl p-5 hover:border-[var(--border-strong)] transition-colors shadow-sm';
          const title = document.createElement('p');
          title.className = 'font-bold text-[var(--text-primary)] text-base leading-tight';
          title.textContent = event.title;
          const meta = document.createElement('p');
          meta.className = 'text-[10px] font-bold tracking-widest uppercase text-[var(--text-tertiary)] mt-2 flex items-center gap-2';
          const timeSpan = document.createElement('span');
          timeSpan.textContent = new Date(event.event_date).toLocaleString();

          const separatorSpan = document.createElement('span');
          separatorSpan.className = 'text-[var(--border-strong)]';
          separatorSpan.textContent = '|';

          const locSpan = document.createElement('span');
          locSpan.className = 'truncate';
          locSpan.textContent = event.location || 'TBD';

          meta.innerHTML = `<svg class="w-3.5 h-3.5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`;
          meta.appendChild(timeSpan);
          meta.appendChild(separatorSpan);

          const iconSpan = document.createElement('span');
          iconSpan.innerHTML = `<svg class="w-3.5 h-3.5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>`;
          meta.appendChild(iconSpan.firstChild);
          meta.appendChild(locSpan);

          const desc = document.createElement('p');
          desc.className = 'text-[13px] font-medium text-[var(--text-secondary)] mt-3 leading-relaxed';
          desc.textContent = event.description || 'No description provided.';
          card.appendChild(title);
          card.appendChild(meta);
          card.appendChild(desc);
          list.appendChild(card);
        });
      } catch (err) {
        console.error('Failed to load events:', err);
        list.innerHTML = '';
        emptyState.querySelector('[data-empty-heading]').textContent = 'Failed to load events.';
        emptyState.querySelector('[data-empty-subtext]').textContent = 'Please try again later.';
        emptyState.classList.remove('hidden');
      }
    };

    apiFetch('/auth/me')
      .then((response) => {
        const entities = response?.data?.entities || [];
        entitySelect.innerHTML = '';
        entities.forEach((entity) => {
          const option = document.createElement('option');
          option.value = entity.id;
          option.textContent = entity.name;
          entitySelect.appendChild(option);
        });
        if (entities.length) {
          entitySelect.value = entities[0].id;
          loadEvents();
        }
      })
      .catch((err) => {
        if (err.status === 401 || err.status === 403 || String(err.message).includes('401') || String(err.message).includes('Unauthorized') || String(err.message).includes('Forbidden')) {
          window.location.href = '/login.html';
          return;
        }
        console.error('Failed to load entities:', err);
        entitySelect.innerHTML = '';
        entitySelect.disabled = true;
        emptyState.querySelector('[data-empty-heading]').textContent = 'Unable to load calendar without access.';
        emptyState.querySelector('[data-empty-subtext]').textContent = '';
        emptyState.classList.remove('hidden');
        // Disable form when no entities are accessible
        form.querySelectorAll('input, textarea, select, button').forEach(el => { el.disabled = true; });
      });

    entitySelect.addEventListener('change', loadEvents);
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (form.dataset.submitting) return;
      if (!entitySelect.value) {
        setStatus('No entity selected.', false);
        return;
      }
      form.dataset.submitting = 'true';
      const submitBtn = form.querySelector('button[type="submit"]');
      if (submitBtn) submitBtn.disabled = true;
      const payload = Object.fromEntries(new FormData(form).entries());
      payload.entity_id = entitySelect.value;
      try {
        await apiFetch('/calendar', { method: 'POST', body: JSON.stringify(payload) });
        setStatus('Event created successfully.', true);
        form.reset();
        loadEvents();
      } catch (err) {
        setStatus(normalizeError(err), false);
      } finally {
        form.dataset.submitting = '';
        if (submitBtn) submitBtn.disabled = false;
      }
    });
  </script>
</body>

</html>
