<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <!-- Theme Init Script to prevent FOUC -->
  <script src="/assets/theme-init.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Calendar</title>
  <link rel="stylesheet" href="/assets/app.css" />
</head>

<body
  class="bg-[var(--bg-base)] text-[var(--text-primary)] min-h-screen selection:bg-[var(--text-secondary)] selection:text-[var(--bg-base)]">
  <div class="app-shell">
    <div id="sidebar-container"></div>
    <main class="app-main app-main--wide">
      <header class="app-page-header">
        <h1 id="calendar-heading" class="text-3xl font-bold tracking-tight">Calendar</h1>
        <p class="text-[var(--text-secondary)] mt-1.5 text-sm font-medium">Meetings, deadlines, RSVPs, and minutes.</p>
      </header>

      <section class="mt-6 grid grid-cols-1 xl:grid-cols-[2fr_1fr] gap-8 animate-fade-in">
        <div
          class="card p-0 overflow-hidden shadow-sm border-[var(--border-strong)] bg-[rgba(255,255,255,0.02)] min-h-[360px]">
          <div class="px-6 py-5 border-b border-[var(--border-subtle)] flex items-center justify-between">
            <h2 class="text-lg font-bold tracking-tight text-[var(--text-primary)]">Upcoming Events</h2>
            <label for="calendar-entity" class="sr-only">Select entity</label>
            <select id="calendar-entity" aria-describedby="calendar-heading"
              class="input-field max-w-[200px] py-1.5 text-sm font-medium bg-[var(--bg-surface)]"></select>
          </div>
          <div class="p-6">
            <div id="calendar-list" class="space-y-4"></div>
            <div id="calendar-empty" class="hidden text-center py-12">
              <span
                class="inline-flex h-12 w-12 items-center justify-center rounded-full bg-[var(--bg-surface-hover)] border border-[var(--border-subtle)] text-[var(--text-tertiary)] mb-4">
                <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                </svg>
              </span>
              <p data-empty-heading class="text-sm font-semibold text-[var(--text-secondary)]">No events scheduled.</p>
              <p data-empty-subtext class="text-xs text-[var(--text-tertiary)] mt-1">Select a different entity or create
                a new event.</p>
            </div>
          </div>
        </div>

        <div class="card p-0 overflow-hidden shadow-sm border-[var(--border-strong)] bg-[rgba(255,255,255,0.02)] h-fit">
          <div class="px-6 py-5 border-b border-[var(--border-subtle)]">
            <h2 class="text-lg font-bold tracking-tight text-[var(--text-primary)]">Add Event</h2>
          </div>
          <form id="calendar-form" class="p-6 space-y-5 bg-[var(--bg-surface)]">
            <div class="space-y-1.5">
              <label for="calendar-title"
                class="block text-xs font-bold text-[var(--text-secondary)] uppercase tracking-wider">Event
                Title</label>
              <input id="calendar-title" name="title" required placeholder="Quarterly Review"
                class="input-field font-medium w-full" />
            </div>
                        <div class="space-y-1.5">
              <label for="calendar-event-date"
                class="block text-xs font-bold text-[var(--text-secondary)] uppercase tracking-wider">Date &
                Time</label>
              <input id="calendar-event-date" name="event_date" type="datetime-local" required
                min="2000-01-01T00:00" max="2100-12-31T23:59"
                class="input-field font-medium w-full" />
            </div>
            <div class="space-y-1.5">
              <label for="calendar-end-date"
                class="block text-xs font-bold text-[var(--text-secondary)] uppercase tracking-wider">End Date (Optional)</label>
              <input id="calendar-end-date" name="end_date" type="datetime-local"
                min="2000-01-01T00:00" max="2100-12-31T23:59"
                class="input-field font-medium w-full" />
            </div>
            <div class="space-y-1.5">
              <label for="calendar-location"
                class="block text-xs font-bold text-[var(--text-secondary)] uppercase tracking-wider">Location</label>
              <input id="calendar-location" name="location" placeholder="e.g. Conference Room A"
                class="input-field font-medium w-full" />
            </div>
            <div class="space-y-1.5">
              <label for="calendar-description"
                class="block text-xs font-bold text-[var(--text-secondary)] uppercase tracking-wider">Description</label>
              <textarea id="calendar-description" name="description" rows="3" placeholder="Additional details..."
                class="input-field font-medium w-full resize-y"></textarea>
            </div>

            <div id="calendar-status" role="status" aria-live="polite" aria-atomic="true"
              class="hidden text-sm rounded-lg px-4 py-3 font-medium border border-[var(--border-subtle)]"></div>

            <div class="pt-2">
              <button class="btn btn-primary w-full shadow-sm" type="submit">Create Event</button>
            </div>
          </form>
        </div>
      </section>
    </main>
  </div>
    <div id="delete-modal" role="dialog" aria-modal="true" aria-labelledby="delete-title" aria-describedby="delete-message" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="card w-full max-w-sm shadow-2xl border-[var(--color-danger)] border animate-fade-in">
      <div class="flex items-center justify-between">
        <h2 id="delete-title" class="text-lg font-bold">Confirm delete</h2>
        <button id="delete-close" aria-label="Close" class="text-[var(--text-secondary)] hover:text-[var(--text-primary)] transition-colors p-1 rounded-md hover:bg-[rgba(255,255,255,0.05)]">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>
      <p id="delete-message" class="mt-3 text-sm font-medium text-[var(--text-secondary)]">Delete this event?</p>
      <div class="mt-6 flex justify-end gap-3 pt-4 border-t border-[var(--border-subtle)]">
        <button id="delete-cancel" type="button" class="btn btn-ghost px-5">Cancel</button>
        <button id="delete-confirm" type="button" class="btn btn-danger font-semibold px-6 bg-[rgba(239,68,68,0.15)]">Delete</button>
      </div>
    </div>
  </div>
  <script type="module" src="/assets/calendar.js"></script>
</body>

</html>
