<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entity Endeavours</title>
  
  <link rel="stylesheet" href="/assets/app.css" />
</head>

<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div class="flex">
    <div id="sidebar-container"></div>
    <main class="flex-1 p-6 md:p-10">
      <header class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-8">
        <div>
          <h1 class="text-2xl font-bold tracking-tight">Entity Endeavours</h1>
          <p class="text-slate-400 mt-1 text-sm">Create endeavours, attach plans, and manage lifecycle phases.</p>
        </div>
        <div class="flex gap-3">
          <select id="entity-select" class="input-field max-w-xs"></select>
        </div>
      </header>

      <section class="card mb-10 animate-fade-in shadow-md">
        <h2 class="text-lg font-semibold tracking-tight">Create Endeavour</h2>
        <form id="create-form" class="grid grid-cols-1 md:grid-cols-2 gap-5 mt-5">
          <div class="space-y-1">
            <label for="endeavour_name" class="text-xs font-medium text-slate-400">Title</label>
            <input id="endeavour_name" name="name" required placeholder="Endeavour Title" class="input-field" />
          </div>
          <div class="space-y-1">
            <label for="endeavour_description" class="text-xs font-medium text-slate-400">Description</label>
            <input id="endeavour_description" name="description" placeholder="Short description" class="input-field" />
          </div>
          <div class="space-y-1">
            <label for="event_start_at" class="text-xs font-medium text-slate-400">Event Start</label>
            <input id="event_start_at" name="event_start_at" type="datetime-local" class="input-field" />
          </div>
          <div class="space-y-1">
            <label for="event_end_at" class="text-xs font-medium text-slate-400">Event End</label>
            <input id="event_end_at" name="event_end_at" type="datetime-local" class="input-field" />
          </div>
          <div class="space-y-1">
            <label for="volunteer_registration_deadline" class="text-xs font-medium text-slate-400">Volunteering
              Deadline</label>
            <input id="volunteer_registration_deadline" name="volunteer_registration_deadline" type="datetime-local"
              class="input-field" />
          </div>
          <div class="space-y-1">
            <label for="pre_financial_deadline" class="text-xs font-medium text-slate-400">Pre-Financial
              Deadline</label>
            <input id="pre_financial_deadline" name="pre_financial_deadline" type="datetime-local"
              class="input-field" />
          </div>
          <div class="space-y-1">
            <label for="post_financial_deadline" class="text-xs font-medium text-slate-400">Post-Financial
              Deadline</label>
            <input id="post_financial_deadline" name="post_financial_deadline" type="datetime-local"
              class="input-field" />
          </div>

          <div class="flex flex-col justify-center gap-3 pt-4">
            <label for="volunteering_enabled" class="flex items-center gap-3 cursor-pointer group">
              <input id="volunteering_enabled" type="checkbox" name="volunteering_enabled"
                class="w-4 h-4 rounded bg-slate-900 border-slate-700 text-indigo-500 focus:ring-indigo-500 focus:ring-opacity-25" />
              <span class="text-sm font-medium text-slate-300 group-hover:text-white transition-colors">Volunteering
                enabled</span>
            </label>
            <label for="transport_fee_required" class="flex items-center gap-3 cursor-pointer group">
              <input id="transport_fee_required" type="checkbox" name="transport_fee_required"
                class="w-4 h-4 rounded bg-slate-900 border-slate-700 text-indigo-500 focus:ring-indigo-500 focus:ring-opacity-25" />
              <span class="text-sm font-medium text-slate-300 group-hover:text-white transition-colors">Transport fee
                required</span>
            </label>
          </div>

          <div id="create-status" class="hidden text-sm rounded-xl px-4 py-3 md:col-span-2 mt-4"></div>
          <div class="md:col-span-2 flex justify-end mt-2">
            <button type="submit" class="btn btn-primary px-8">Create Endeavour</button>
          </div>
        </form>
      </section>

      <section class="mt-8">
        <h2 class="text-xl font-semibold tracking-tight mb-6">Active Endeavours</h2>
        <div id="endeavour-list" class="space-y-8"></div>
        <div id="endeavour-empty" class="hidden text-center py-16 card border-dashed border-slate-700">
          <p class="text-slate-400">No active endeavours yet. Create one above.</p>
        </div>
      </section>
    </main>
  </div>
  <script type="module" src="/assets/entity_endeavours.js"></script>
</body>

</html>
