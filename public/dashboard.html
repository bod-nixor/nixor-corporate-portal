<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entity Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/assets/app.css" />
</head>

<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div class="flex">
    <div id="sidebar-container"></div>
    <main class="flex-1 p-6 md:p-10">
      <header class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-8">
        <div>
          <h1 class="text-2xl font-bold tracking-tight">Entity Dashboard</h1>
          <p class="text-slate-400 text-sm mt-1">High-level pulse on docs, meetings, deadlines, and announcements.</p>
        </div>
        <div class="flex flex-col md:flex-row gap-3">
          <select id="entity-select" class="input-field max-w-xs"></select>
          <button id="announcement-button" class="btn btn-primary shadow-sm disabled:opacity-50">Create
            Announcement</button>
        </div>
      </header>

      <section class="grid grid-cols-1 lg:grid-cols-4 gap-6 animate-fade-in">
        <div class="card card-hoverable">
          <h2 class="text-sm font-medium text-slate-400 uppercase tracking-wide">Documentation Progress</h2>
          <p id="doc-progress" class="text-4xl font-bold mt-4 tracking-tight">--</p>
          <p id="doc-summary" class="text-sm text-slate-500 mt-2">Loading...</p>
        </div>
        <div class="card card-hoverable flex flex-col">
          <h2 class="text-sm font-medium text-slate-400 uppercase tracking-wide">Pending Documentation</h2>
          <ul id="pending-docs-list" class="mt-4 space-y-3 flex-1"></ul>
        </div>
        <div class="card card-hoverable flex flex-col">
          <h2 class="text-sm font-medium text-slate-400 uppercase tracking-wide">Upcoming Meetings</h2>
          <ul id="meetings-list" class="mt-4 space-y-3 flex-1"></ul>
        </div>
        <div class="card card-hoverable flex flex-col">
          <h2 class="text-sm font-medium text-slate-400 uppercase tracking-wide">Critical Deadlines</h2>
          <ul id="deadlines-list" class="mt-4 space-y-3 flex-1"></ul>
        </div>
      </section>
      <section class="mt-12">
        <div class="flex items-center justify-between mb-6">
          <h2 class="text-xl font-semibold tracking-tight">Announcements</h2>
        </div>
        <div id="announcements-list" class="space-y-4"></div>
        <div id="announcements-empty" class="hidden text-center py-12 card border-dashed border-slate-700">
          <p class="text-slate-400">No announcements yet.</p>
        </div>
      </section>
    </main>
  </div>
  <div id="announcement-modal"
    class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-6 z-50">
    <div class="card w-full max-w-lg shadow-2xl animate-fade-in border-slate-700">
      <div class="flex items-center justify-between mb-6">
        <h3 class="text-lg font-semibold tracking-tight">New Announcement</h3>
        <button id="announcement-close"
          class="text-slate-400 hover:text-white transition-colors p-1 rounded-md hover:bg-slate-800">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </button>
      </div>
      <form id="announcement-form" class="space-y-4">
        <label for="announcement-title" class="sr-only">Announcement title</label>
        <input id="announcement-title" name="title" required placeholder="Announcement title" class="input-field" />

        <label for="announcement-message" class="sr-only">Announcement message</label>
        <textarea id="announcement-message" name="message" rows="4" required placeholder="Announcement message"
          class="input-field resize-none"></textarea>
        <div id="announcement-status" class="hidden text-sm rounded-xl px-4 py-3"></div>
        <div class="pt-2 flex justify-end gap-3">
          <button type="button" id="announcement-cancel" class="btn btn-ghost">Cancel</button>
          <button type="submit" class="btn btn-primary">Publish</button>
        </div>
      </form>
    </div>
  </div>
  <script type="module" src="/assets/dashboard.js"></script>
</body>

</html>
