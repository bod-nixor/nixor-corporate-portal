<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Nixor Portal Login</title>

  <link rel="stylesheet" href="/assets/app.css" />
  <!-- Theme Init Script to prevent FOUC -->
  <script src="/assets/theme-init.js"></script>
</head>

<body
  class="bg-[var(--bg-base)] text-[var(--text-primary)] min-h-screen flex items-center justify-center p-4 selection:bg-[var(--color-primary)] selection:text-white">
  <div class="card w-full max-w-md p-8 md:p-10 mx-auto">
    <div class="mb-8 text-center">
      <div
        class="w-12 h-12 rounded-xl bg-[var(--text-primary)] flex items-center justify-center mx-auto mb-6 shadow-sm">
        <svg class="w-6 h-6 text-[var(--bg-base)]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 10V3L4 14h7v7l9-11h-7z" />
        </svg>
      </div>
      <p class="text-[10px] text-[var(--text-tertiary)] uppercase tracking-[0.2em] font-bold mb-3">Nixor Corporate
        Portal</p>
      <h1 class="text-2xl font-bold tracking-tight mb-2">Welcome back</h1>
      <p class="text-sm text-[var(--text-secondary)]">Sign in to securely access your workspace.</p>
      <form id="login-form" class="space-y-4 text-left" novalidate>
        <div class="space-y-1.5">
          <label for="email-input" class="block text-sm font-medium text-[var(--text-secondary)]">Email address</label>
          <div class="relative">
            <input id="email-input" type="email" name="email" autocomplete="email" class="input-field pl-10"
              placeholder="name@nixor.io" required aria-describedby="email-error" />
            <svg
              class="w-4 h-4 text-[var(--text-tertiary)] absolute top-1/2 left-3.5 -translate-y-1/2 pointer-events-none"
              fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207" />
            </svg>
          </div>
          <p id="email-error" class="hidden text-xs font-semibold text-[#fca5a5]"></p>
        </div>
        <div class="space-y-1.5">
          <div class="flex items-center justify-between">
            <label for="password-input" class="block text-sm font-medium text-[var(--text-secondary)]">Password</label>
            <a href="#"
              class="text-xs font-medium text-[var(--text-primary)] hover:underline decoration-[var(--border-strong)] underline-offset-4">Forgot?</a>
          </div>
          <div class="relative">
            <input id="password-input" type="password" name="password" autocomplete="current-password"
              class="input-field pl-10" placeholder="Enter your password" required aria-describedby="password-error" />
            <svg
              class="w-4 h-4 text-[var(--text-tertiary)] absolute top-1/2 left-3.5 -translate-y-1/2 pointer-events-none"
              fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
            </svg>
          </div>
          <p id="password-error" class="hidden text-xs font-semibold text-[#fca5a5]"></p>
        </div>
        <div id="error-message" role="alert" aria-live="assertive"
          class="hidden text-sm text-[var(--color-danger)] bg-[var(--color-danger-bg)] border border-[#ef444433] rounded-lg px-4 py-3 pb-3 mt-4 flex items-start gap-2">
          <svg class="w-4 h-4 mt-0.5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
              d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
          <span class="flex-1 leading-snug"></span>
        </div>
        <button type="submit" class="btn btn-primary w-full py-2.5 mt-2">Sign In to Dashboard</button>
      </form>

      <div class="relative my-6 text-center">
        <div class="absolute inset-0 flex items-center" aria-hidden="true">
          <div class="w-full border-t border-[var(--border-subtle)]"></div>
        </div>
        <div class="relative z-10 text-xs text-[var(--text-tertiary)] flex justify-center">
          <span
            class="bg-[var(--bg-surface)] px-3 py-1 font-medium tracking-wide uppercase text-[10px] rounded-full border border-[var(--border-subtle)]">or
            continue with</span>
        </div>
      </div>

      <div id="google-login"
        class="w-full rounded-xl border border-[var(--border-strong)] bg-transparent hover:bg-[var(--bg-surface-hover)] transition-colors px-4 py-3 text-sm font-medium flex items-center justify-center gap-2.5 cursor-not-allowed opacity-50"
        aria-disabled="true">
        <svg class="w-4 h-4" viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#FFC107"
            d="M43.6 20.3H42V20H24v8h11.3C33.5 33.5 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C33.5 6.2 28.9 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.7z" />
          <path fill="#FF3D00"
            d="M6.3 14.7l6.6 4.8C14.6 16 19 12 24 12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C33.5 6.2 28.9 4 24 4c-7.6 0-14.2 4.2-17.7 10.7z" />
          <path fill="#4CAF50"
            d="M24 44c4.9 0 9.4-1.9 12.8-5l-6-4.9c-2 1.4-4.5 2.2-6.8 2.2-5.1 0-9.4-3.4-10.9-8l-6.5 5C9.5 39.3 16.2 44 24 44z" />
          <path fill="#1976D2"
            d="M43.6 20.3H42V20H24v8h11.3c-1.1 3.1-3.6 5.5-7 6.8l6 4.9c-.4.4 4.7-3.4 6.7-9.7 1.4-4.1.6-9.1-.4-9.7z" />
        </svg>
        <span>Google Workspace</span>
      </div>
      <div id="google-button" class="hidden flex justify-center"></div>

      <p class="text-[11px] text-[var(--text-tertiary)] text-center mt-8">
        Protected by Nixor Zero Trust. <a
          class="hover:text-[var(--text-secondary)] underline decoration-[var(--border-subtle)] underline-offset-4"
          href="#">Privacy Policy</a>.
      </p>
    </div>
  </div>
  <script type="module">
    import { apiFetch, bootstrapCsrf, isNativeRuntime, startNativeGoogleLogin } from '/assets/app.js';
    const form = document.getElementById('login-form');
    const errorEl = document.getElementById('error-message');
    const emailInput = document.getElementById('email-input');
    const passwordInput = document.getElementById('password-input');
    const emailError = document.getElementById('email-error');
    const passwordError = document.getElementById('password-error');
    const submitBtn = form.querySelector('button[type="submit"]');
    const googlePlaceholder = document.getElementById('google-login');
    const googleButton = document.getElementById('google-button');
    const defaultSubmitText = submitBtn?.textContent || 'Sign In to Dashboard';
    const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    let googleNativeBusy = false;

    const showLoginError = (message) => {
      const errText = errorEl.querySelector('span');
      if (errText) errText.textContent = message;
      else errorEl.textContent = message;
      errorEl.classList.remove('hidden');
    };

    const friendlyError = (err, fallback = 'Something went wrong. Please try again.') => {
      const message = err?.message || '';
      if (err?.status >= 500 || /^HTTP 5\d\d$/.test(message) || /SQLSTATE|PDOException|Integrity constraint/i.test(message)) {
        return fallback;
      }
      return message || fallback;
    };

    const setFieldError = (input, errorNode, message) => {
      if (!input || !errorNode) return;
      errorNode.textContent = message;
      errorNode.classList.remove('hidden');
      input.setAttribute('aria-invalid', 'true');
      input.classList.add('border-[#ef4444]');
    };

    const clearFieldError = (input, errorNode) => {
      if (!input || !errorNode) return;
      errorNode.textContent = '';
      errorNode.classList.add('hidden');
      input.removeAttribute('aria-invalid');
      input.classList.remove('border-[#ef4444]');
    };

    const validateLoginForm = () => {
      clearFieldError(emailInput, emailError);
      clearFieldError(passwordInput, passwordError);
      errorEl.classList.add('hidden');

      const email = emailInput.value.trim();
      const password = passwordInput.value;
      let firstInvalid = null;

      if (!email) {
        setFieldError(emailInput, emailError, 'Email is required.');
        firstInvalid = firstInvalid || emailInput;
      } else if (!emailPattern.test(email)) {
        setFieldError(emailInput, emailError, 'Enter a valid email address.');
        firstInvalid = firstInvalid || emailInput;
      }

      if (!password) {
        setFieldError(passwordInput, passwordError, 'Password is required.');
        firstInvalid = firstInvalid || passwordInput;
      }

      if (firstInvalid) {
        showLoginError('Please fix the highlighted fields.');
        firstInvalid.focus();
        return null;
      }

      return { email, password };
    };

    const disableForm = (message) => {
      if (submitBtn) {
        submitBtn.disabled = true;
      }
      showLoginError(message);
    };

    emailInput.addEventListener('input', () => clearFieldError(emailInput, emailError));
    passwordInput.addEventListener('input', () => clearFieldError(passwordInput, passwordError));

    bootstrapCsrf()
      .catch((err) => {
        console.error('CSRF bootstrap failed:', err);
        const msg = err?.status ? `Unable to start login (HTTP ${err.status}). Please refresh the page.` : 'Unable to start login. Please check your connection or refresh the page.';
        disableForm(msg);
      });

    const resetGoogleNativeBusy = () => {
      googleNativeBusy = false;
      googlePlaceholder.classList.remove('opacity-70');
      googlePlaceholder.setAttribute('aria-busy', 'false');
    };

    window.addEventListener('ncp:mobile-auth-error', (event) => {
      showLoginError(event?.detail?.message || 'Google sign-in failed. Please try again.');
      resetGoogleNativeBusy();
    });
    if (window.NCP_MOBILE_AUTH_ERROR) {
      showLoginError(window.NCP_MOBILE_AUTH_ERROR);
    }

    const enableNativeGoogleLogin = () => {
      googleButton.classList.add('hidden');
      googlePlaceholder.classList.remove('cursor-not-allowed', 'opacity-50');
      googlePlaceholder.classList.add('cursor-pointer');
      googlePlaceholder.setAttribute('aria-disabled', 'false');
      googlePlaceholder.setAttribute('role', 'button');
      googlePlaceholder.setAttribute('tabindex', '0');

      const openGoogleAuth = async () => {
        if (googleNativeBusy) {
          return;
        }
        googleNativeBusy = true;
        errorEl.classList.add('hidden');
        googlePlaceholder.classList.add('opacity-70');
        googlePlaceholder.setAttribute('aria-busy', 'true');
        try {
          await startNativeGoogleLogin();
        } catch (err) {
          resetGoogleNativeBusy();
          showLoginError(friendlyError(err, 'Unable to open Google sign-in. Please try again.'));
        }
      };

      googlePlaceholder.addEventListener('click', openGoogleAuth);
      googlePlaceholder.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          openGoogleAuth();
        }
      });
    };

    const enableGoogleLogin = async () => {
      let config;
      try {
        const response = await apiFetch('/auth/config');
        config = response?.data;
      } catch (err) {
        return;
      }
      const clientId = config?.google_client_id;
      if (!clientId || !window.google?.accounts?.id) {
        return;
      }
      google.accounts.id.initialize({
        client_id: clientId,
        callback: async (response) => {
          if (!response?.credential) {
            const errText = errorEl.querySelector('span');
            if (errText) errText.textContent = 'Google sign-in failed.';
            errorEl.classList.remove('hidden');
            return;
          }
          try {
            await apiFetch('/auth/google_callback', {
              method: 'POST',
              body: JSON.stringify({ id_token: response.credential })
            });
            window.location.href = '/dashboard.html';
          } catch (err) {
            showLoginError(friendlyError(err, 'Google sign-in failed. Please try again.'));
          }
        }
      });
      google.accounts.id.renderButton(googleButton, {
        theme: 'outline',
        size: 'large',
        width: 320
      });
      googlePlaceholder.classList.add('hidden');
      googleButton.classList.remove('hidden');
    };

    const loadGoogleClient = () => new Promise((resolve, reject) => {
      if (window.google?.accounts?.id) {
        resolve();
        return;
      }
      const existing = document.querySelector('script[data-google-gsi="true"]');
      if (existing) {
        existing.addEventListener('load', () => resolve(), { once: true });
        existing.addEventListener('error', () => reject(new Error('Google sign-in unavailable')), { once: true });
        return;
      }
      const script = document.createElement('script');
      script.src = 'https://accounts.google.com/gsi/client';
      script.async = true;
      script.defer = true;
      script.dataset.googleGsi = 'true';
      script.onload = () => resolve();
      script.onerror = () => reject(new Error('Google sign-in unavailable'));
      document.head.appendChild(script);
    });

    const waitForGoogleClient = async () => {
      try {
        await loadGoogleClient();
      } catch (err) {
        return;
      }
      if (window.google?.accounts?.id) {
        enableGoogleLogin();
      }
    };

    const urlError = new URLSearchParams(window.location.search).get('error');
    if (urlError === 'google_auth_failed') {
      showLoginError('Google sign-in could not be completed. Please try again.');
    }

    if (isNativeRuntime()) {
      enableNativeGoogleLogin();
    } else {
      waitForGoogleClient();
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (submitBtn?.disabled) {
        return;
      }
      const payload = validateLoginForm();
      if (!payload) {
        return;
      }
      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing in...';
      try {
        await apiFetch('/auth/login', { method: 'POST', body: JSON.stringify(payload) });
        errorEl.classList.add('hidden');
        window.location.href = '/dashboard.html';
      } catch (err) {
        showLoginError(friendlyError(err));
        submitBtn.disabled = false;
        submitBtn.textContent = defaultSubmitText;
      }
    });
  </script>
</body>

</html>
