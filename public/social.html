<!DOCTYPE html>
<html lang="en">

<head>
  <!-- Theme Init Script to prevent FOUC -->
  <script src="/assets/theme-init.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Social Feed</title>
  <link rel="stylesheet" href="/assets/app.css" />
</head>

<body
  class="bg-[var(--bg-base)] text-[var(--text-primary)] min-h-screen selection:bg-[var(--text-secondary)] selection:text-[var(--bg-base)]">
  <div class="app-shell">
    <div id="sidebar-container"></div>
    <main class="app-main app-main--wide">
      <header class="app-page-header flex flex-col md:flex-row md:items-end justify-between gap-5">
        <div>
          <h1 class="text-3xl font-bold tracking-tight">Social Feed</h1>
          <p class="text-[var(--text-secondary)] mt-1.5 text-sm font-medium">Professional updates limited to involved
            members.</p>
        </div>
        <button id="open-post-modal" type="button" class="btn btn-primary">New Post</button>
      </header>

      <section class="mt-8 animate-fade-in">
        <div>
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
            <h2 class="text-lg font-bold tracking-tight">Recent Posts</h2>
            <select id="social-entity" class="input-field max-w-[240px] py-1.5 text-sm font-medium"></select>
          </div>
          <div id="social-posts" class="space-y-6"></div>
          <div id="social-empty"
            class="hidden text-center py-16 border border-dashed border-[var(--border-strong)] rounded-2xl bg-[rgba(255,255,255,0.01)] mt-4">
            <span
              class="inline-flex h-12 w-12 items-center justify-center rounded-full bg-[var(--bg-surface-hover)] border border-[var(--border-subtle)] text-[var(--text-tertiary)] mb-4">
              <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z">
                </path>
              </svg>
            </span>
            <p class="text-sm font-semibold text-[var(--text-secondary)]">No posts found.</p>
            <p class="text-xs text-[var(--text-tertiary)] mt-1">Be the first to share an update with this entity.</p>
          </div>
        </div>

        <div id="post-modal" class="hidden fixed inset-0 z-50 bg-black/65 backdrop-blur-sm p-4 overflow-y-auto">
          <div class="min-h-full flex items-center justify-center">
          <div
            class="card w-full max-w-lg p-0 overflow-hidden shadow-sm border-[var(--border-strong)] bg-[rgba(255,255,255,0.02)]">
            <div class="px-6 py-5 border-b border-[var(--border-subtle)] flex items-center justify-between gap-4">
              <h2 class="text-lg font-bold tracking-tight text-[var(--text-primary)]">New Post</h2>
              <button id="close-post-modal" type="button" class="btn btn-ghost px-3 py-2" aria-label="Close new post">
                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path></svg>
              </button>
            </div>
            <form id="social-form" class="p-6 space-y-5 bg-[var(--bg-surface)]">
              <div class="space-y-1.5">
                <label for="social-scope" class="block text-xs font-bold text-[var(--text-secondary)] uppercase tracking-wider">Feed</label>
                <select id="social-scope" name="feed_scope" class="input-field">
                  <option value="entity">Selected entity</option>
                  <option value="global">Global public feed</option>
                </select>
              </div>
              <div class="space-y-1.5">
                <label for="social-content" class="sr-only">Post Content</label>
                <textarea id="social-content" name="content" rows="4" required placeholder="What's happening?"
                  class="input-field font-medium w-full resize-y bg-[var(--bg-base)]"></textarea>
              </div>
              <div class="space-y-1.5">
                <label for="social-images" class="block text-xs font-bold text-[var(--text-secondary)] uppercase tracking-wider">Image URLs</label>
                <input id="social-images" name="image_urls" class="input-field" placeholder="Up to 10 URLs, comma separated" />
              </div>

              <div id="social-status"
                class="hidden text-sm rounded-lg px-4 py-3 font-medium border border-[var(--border-subtle)]"></div>

              <div class="pt-2">
                <button class="btn btn-primary w-full shadow-sm" type="submit">Publish Update</button>
              </div>
            </form>
          </div>
          </div>
        </div>
      </section>
    </main>
  </div>
    <div id="delete-modal" role="dialog" aria-modal="true" aria-labelledby="delete-title" aria-describedby="delete-message" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="card w-full max-w-sm shadow-2xl border-[var(--color-danger)] border animate-fade-in">
      <div class="flex items-center justify-between">
        <h2 id="delete-title" class="text-lg font-bold">Confirm delete</h2>
        <button id="delete-close" aria-label="Close" class="text-[var(--text-secondary)] hover:text-[var(--text-primary)] transition-colors p-1 rounded-md hover:bg-[rgba(255,255,255,0.05)]">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>
      <p id="delete-message" class="mt-3 text-sm font-medium text-[var(--text-secondary)]">Delete this item?</p>
      <div class="mt-6 flex justify-end gap-3 pt-4 border-t border-[var(--border-subtle)]">
        <button id="delete-cancel" type="button" class="btn btn-ghost px-5">Cancel</button>
        <button id="delete-confirm" type="button" class="btn btn-danger font-semibold px-6 bg-[rgba(239,68,68,0.15)]">Delete</button>
      </div>
    </div>
  </div>
  <script type="module" src="/assets/social.js"></script>
</body>

</html>
