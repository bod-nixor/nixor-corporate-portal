<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Theme Init Script to prevent FOUC -->
  <script src="/assets/theme-init.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Portal Settings</title>
    <link rel="stylesheet" href="/assets/app.css" />
</head>

<body
    class="bg-[var(--bg-base)] text-[var(--text-primary)] min-h-screen selection:bg-[var(--text-secondary)] selection:text-[var(--bg-base)]">
    <div class="app-shell">
        <div id="sidebar-container"></div>
        <main class="app-main app-main--narrow">
            <header class="app-page-header">
                <h1 class="text-3xl font-bold tracking-tight">Settings</h1>
                <p class="text-[var(--text-secondary)] mt-1.5 text-sm font-medium">Manage your personal portal
                    preferences.</p>
            </header>

            <section class="animate-fade-in">
                <div
                    class="card p-0 overflow-hidden shadow-sm border-[var(--border-strong)] bg-[rgba(255,255,255,0.015)]">
                    <div class="px-6 py-5 border-b border-[var(--border-subtle)]">
                        <h2 class="text-lg font-bold tracking-tight">Appearance</h2>
                        <p class="text-[var(--text-secondary)] mt-1 text-sm">Customize the theme of your portal
                            interface.</p>
                    </div>

                    <div class="p-6">
                        <div class="grid grid-cols-2 md:grid-cols-3 gap-4" id="theme-grid">
                            <!-- Default Dark Theme -->
                            <button aria-label="Select Default Dark Theme" aria-pressed="false"
                                class="theme-btn relative text-left group rounded-xl p-4 border-2 transition-all hover:-translate-y-0.5"
                                data-theme="theme-default"
                                style="border-color: var(--border-subtle); background-color: #09090b;">
                                <div
                                    class="absolute inset-0 rounded-xl ring-2 ring-transparent group-focus-visible:ring-blue-500 pointer-events-none">
                                </div>
                                <div class="h-24 w-full rounded-md mb-3 border border-white/10 shadow-sm overflow-hidden flex flex-col"
                                    style="background-color: #18181b;">
                                    <div
                                        class="h-6 w-full px-2 py-1.5 border-b border-white/5 bg-white/5 flex items-center gap-1.5">
                                        <div class="w-2 h-2 rounded-full bg-white/20"></div>
                                        <div class="w-2 h-2 rounded-full bg-white/20"></div>
                                    </div>
                                    <div class="flex-1 p-2">
                                        <div class="w-1/2 h-2 rounded bg-[#3b82f6] mb-1.5"></div>
                                        <div class="w-3/4 h-2 rounded bg-white/20"></div>
                                    </div>
                                </div>
                                <div class="flex items-center justify-between">
                                    <span class="font-medium text-sm" style="color: #fafafa;">Default Dark</span>
                                    <div
                                        class="theme-check hidden w-5 h-5 rounded-full bg-blue-500 text-white flex items-center justify-center">
                                        <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3"
                                                d="M5 13l4 4L19 7"></path>
                                        </svg>
                                    </div>
                                </div>
                            </button>

                            <!-- Light Theme -->
                            <button aria-label="Select Light Theme" aria-pressed="false"
                                class="theme-btn relative text-left group rounded-xl p-4 border-2 transition-all hover:-translate-y-0.5"
                                data-theme="theme-light"
                                style="border-color: var(--border-subtle); background-color: #f4f4f5;">
                                <div class="h-24 w-full rounded-md mb-3 border border-black/10 shadow-sm overflow-hidden flex flex-col"
                                    style="background-color: #ffffff;">
                                    <div
                                        class="h-6 w-full px-2 py-1.5 border-b border-black/5 bg-black/5 flex items-center gap-1.5">
                                        <div class="w-2 h-2 rounded-full bg-black/20"></div>
                                        <div class="w-2 h-2 rounded-full bg-black/20"></div>
                                    </div>
                                    <div class="flex-1 p-2">
                                        <div class="w-1/2 h-2 rounded bg-[#2563eb] mb-1.5"></div>
                                        <div class="w-3/4 h-2 rounded bg-black/20"></div>
                                    </div>
                                </div>
                                <div class="flex items-center justify-between">
                                    <span class="font-medium text-sm" style="color: #09090b;">Light Mode</span>
                                    <div
                                        class="theme-check hidden w-5 h-5 rounded-full bg-blue-500 text-white flex items-center justify-center">
                                        <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3"
                                                d="M5 13l4 4L19 7"></path>
                                        </svg>
                                    </div>
                                </div>
                            </button>

                            <!-- Midnight Theme -->
                            <button aria-label="Select Midnight Theme" aria-pressed="false"
                                class="theme-btn relative text-left group rounded-xl p-4 border-2 transition-all hover:-translate-y-0.5"
                                data-theme="theme-midnight"
                                style="border-color: var(--border-subtle); background-color: #020617;">
                                <div class="h-24 w-full rounded-md mb-3 border border-white/10 shadow-sm overflow-hidden flex flex-col"
                                    style="background-color: #0f172a;">
                                    <div
                                        class="h-6 w-full px-2 py-1.5 border-b border-white/5 bg-white/5 flex items-center gap-1.5">
                                        <div class="w-2 h-2 rounded-full bg-white/20"></div>
                                        <div class="w-2 h-2 rounded-full bg-white/20"></div>
                                    </div>
                                    <div class="flex-1 p-2">
                                        <div class="w-1/2 h-2 rounded bg-[#3b82f6] mb-1.5"></div>
                                        <div class="w-3/4 h-2 rounded bg-white/20"></div>
                                    </div>
                                </div>
                                <div class="flex items-center justify-between">
                                    <span class="font-medium text-sm" style="color: #f8fafc;">Midnight</span>
                                    <div
                                        class="theme-check hidden w-5 h-5 rounded-full bg-blue-500 text-white flex items-center justify-center">
                                        <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3"
                                                d="M5 13l4 4L19 7"></path>
                                        </svg>
                                    </div>
                                </div>
                            </button>

                            <!-- Graphite Theme -->
                            <button aria-label="Select Graphite Theme" aria-pressed="false"
                                class="theme-btn relative text-left group rounded-xl p-4 border-2 transition-all hover:-translate-y-0.5"
                                data-theme="theme-graphite"
                                style="border-color: var(--border-subtle); background-color: #111111;">
                                <div class="h-24 w-full rounded-md mb-3 border border-white/10 shadow-sm overflow-hidden flex flex-col"
                                    style="background-color: #1e1e1e;">
                                    <div
                                        class="h-6 w-full px-2 py-1.5 border-b border-white/5 bg-white/5 flex items-center gap-1.5">
                                        <div class="w-2 h-2 rounded-full bg-white/20"></div>
                                        <div class="w-2 h-2 rounded-full bg-white/20"></div>
                                    </div>
                                    <div class="flex-1 p-2">
                                        <div class="w-1/2 h-2 rounded bg-[#e5e5e5] mb-1.5"></div>
                                        <div class="w-3/4 h-2 rounded bg-white/20"></div>
                                    </div>
                                </div>
                                <div class="flex items-center justify-between">
                                    <span class="font-medium text-sm" style="color: #f5f5f5;">Graphite</span>
                                    <div
                                        class="theme-check hidden w-5 h-5 rounded-full bg-white text-black flex items-center justify-center">
                                        <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3"
                                                d="M5 13l4 4L19 7"></path>
                                        </svg>
                                    </div>
                                </div>
                            </button>

                            <!-- Indigo Theme -->
                            <button aria-label="Select Indigo Theme" aria-pressed="false"
                                class="theme-btn relative text-left group rounded-xl p-4 border-2 transition-all hover:-translate-y-0.5"
                                data-theme="theme-indigo"
                                style="border-color: rgba(165,180,252,0.2); background-color: #0f0e17;">
                                <div class="h-24 w-full rounded-md mb-3 border border-indigo-200/20 shadow-sm overflow-hidden flex flex-col"
                                    style="background-color: #1e1b4b;">
                                    <div
                                        class="h-6 w-full px-2 py-1.5 border-b border-indigo-200/10 bg-indigo-200/10 flex items-center gap-1.5">
                                        <div class="w-2 h-2 rounded-full bg-indigo-200/30"></div>
                                        <div class="w-2 h-2 rounded-full bg-indigo-200/30"></div>
                                    </div>
                                    <div class="flex-1 p-2">
                                        <div class="w-1/2 h-2 rounded bg-[#818cf8] mb-1.5"></div>
                                        <div class="w-3/4 h-2 rounded bg-indigo-200/30"></div>
                                    </div>
                                </div>
                                <div class="flex items-center justify-between">
                                    <span class="font-medium text-sm" style="color: #e0e7ff;">Indigo</span>
                                    <div
                                        class="theme-check hidden w-5 h-5 rounded-full bg-[#6366f1] text-white flex items-center justify-center">
                                        <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3"
                                                d="M5 13l4 4L19 7"></path>
                                        </svg>
                                    </div>
                                </div>
                            </button>

                            <!-- Emerald Theme -->
                            <button aria-label="Select Emerald Theme" aria-pressed="false"
                                class="theme-btn relative text-left group rounded-xl p-4 border-2 transition-all hover:-translate-y-0.5"
                                data-theme="theme-emerald"
                                style="border-color: rgba(110,231,183,0.2); background-color: #022c22;">
                                <div class="h-24 w-full rounded-md mb-3 border border-emerald-200/20 shadow-sm overflow-hidden flex flex-col"
                                    style="background-color: #064e3b;">
                                    <div
                                        class="h-6 w-full px-2 py-1.5 border-b border-emerald-200/10 bg-emerald-200/10 flex items-center gap-1.5">
                                        <div class="w-2 h-2 rounded-full bg-emerald-200/30"></div>
                                        <div class="w-2 h-2 rounded-full bg-emerald-200/30"></div>
                                    </div>
                                    <div class="flex-1 p-2">
                                        <div class="w-1/2 h-2 rounded bg-[#10b981] mb-1.5"></div>
                                        <div class="w-3/4 h-2 rounded bg-emerald-200/30"></div>
                                    </div>
                                </div>
                                <div class="flex items-center justify-between">
                                    <span class="font-medium text-sm" style="color: #ecfdf5;">Emerald</span>
                                    <div
                                        class="theme-check hidden w-5 h-5 rounded-full bg-[#10b981] text-white flex items-center justify-center">
                                        <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3"
                                                d="M5 13l4 4L19 7"></path>
                                        </svg>
                                    </div>
                                </div>
                            </button>
                        </div>
                    </div>
                </div>
            </section>

            <section class="animate-fade-in mt-6">
                <div
                    class="card p-0 overflow-hidden shadow-sm border-[var(--border-strong)] bg-[rgba(255,255,255,0.015)]">
                    <div class="px-6 py-5 border-b border-[var(--border-subtle)]">
                        <h2 class="text-lg font-bold tracking-tight">Notifications</h2>
                        <p class="text-[var(--text-secondary)] mt-1 text-sm">Choose where operational alerts reach you.</p>
                    </div>
                    <form id="notification-form" class="p-6 space-y-4">
                        <label class="flex items-center justify-between gap-4 rounded-lg border border-[var(--border-subtle)] bg-[var(--bg-surface)] px-4 py-3">
                            <span class="text-sm font-semibold">In-portal notifications</span>
                            <input type="checkbox" name="platform_enabled" class="h-5 w-5 accent-[var(--color-primary)]" />
                        </label>
                        <label class="flex items-center justify-between gap-4 rounded-lg border border-[var(--border-subtle)] bg-[var(--bg-surface)] px-4 py-3">
                            <span class="text-sm font-semibold">Email notifications</span>
                            <input type="checkbox" name="email_enabled" class="h-5 w-5 accent-[var(--color-primary)]" />
                        </label>
                        <label class="flex items-center justify-between gap-4 rounded-lg border border-[var(--border-subtle)] bg-[var(--bg-surface)] px-4 py-3">
                            <span class="text-sm font-semibold">Mobile push</span>
                            <input type="checkbox" name="push_enabled" class="h-5 w-5 accent-[var(--color-primary)]" />
                        </label>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <label class="flex items-center justify-between gap-3 rounded-lg border border-[var(--border-subtle)] px-4 py-3">
                                <span class="text-sm text-[var(--text-secondary)]">Approvals</span>
                                <input type="checkbox" name="approvals_enabled" class="h-5 w-5 accent-[var(--color-primary)]" />
                            </label>
                            <label class="flex items-center justify-between gap-3 rounded-lg border border-[var(--border-subtle)] px-4 py-3">
                                <span class="text-sm text-[var(--text-secondary)]">Volunteering</span>
                                <input type="checkbox" name="volunteering_enabled" class="h-5 w-5 accent-[var(--color-primary)]" />
                            </label>
                            <label class="flex items-center justify-between gap-3 rounded-lg border border-[var(--border-subtle)] px-4 py-3">
                                <span class="text-sm text-[var(--text-secondary)]">Social</span>
                                <input type="checkbox" name="social_enabled" class="h-5 w-5 accent-[var(--color-primary)]" />
                            </label>
                            <label class="flex items-center justify-between gap-3 rounded-lg border border-[var(--border-subtle)] px-4 py-3">
                                <span class="text-sm text-[var(--text-secondary)]">Calendar</span>
                                <input type="checkbox" name="calendar_enabled" class="h-5 w-5 accent-[var(--color-primary)]" />
                            </label>
                        </div>
                        <div id="notification-status" class="hidden text-sm rounded-lg px-4 py-3 border" role="status" aria-live="polite"></div>
                        <button class="btn btn-primary" type="submit">Save Preferences</button>
                    </form>
                </div>
            </section>
        </main>
    </div>
    <script type="module" src="/assets/settings.js"></script>
</body>

</html>
