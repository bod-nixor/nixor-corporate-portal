<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Forgot Password - Nixor Portal</title>
  <link rel="stylesheet" href="/assets/app.css" />
  <script src="/assets/theme-init.js"></script>
</head>

<body
  class="bg-[var(--bg-base)] text-[var(--text-primary)] min-h-screen flex items-center justify-center p-4 selection:bg-[var(--color-primary)] selection:text-white">
  <main class="card w-full max-w-md p-8 md:p-10 mx-auto">
    <div class="mb-8 text-center">
      <div class="w-12 h-12 rounded-xl bg-[var(--text-primary)] flex items-center justify-center mx-auto mb-6 shadow-sm">
        <svg class="w-6 h-6 text-[var(--bg-base)]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
            d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
        </svg>
      </div>
      <p class="text-[10px] text-[var(--text-tertiary)] uppercase tracking-[0.2em] font-bold mb-3">Nixor Corporate
        Portal</p>
      <h1 class="text-2xl font-bold tracking-tight mb-2">Reset your password</h1>
      <p class="text-sm text-[var(--text-secondary)]">Enter your portal email address.</p>
    </div>

    <form id="forgot-password-form" class="space-y-4" novalidate>
      <div class="space-y-1.5">
        <label for="email-input" class="block text-sm font-medium text-[var(--text-secondary)]">Email address</label>
        <input id="email-input" type="email" name="email" autocomplete="email" class="input-field"
          placeholder="name@example.com" required />
      </div>
      <div id="forgot-status" role="status" aria-live="polite"
        class="hidden text-sm rounded-lg px-4 py-3 border border-[var(--border-subtle)]"></div>
      <button type="submit" class="btn btn-primary w-full py-2.5">Send reset link</button>
    </form>

    <p class="text-[11px] text-[var(--text-tertiary)] text-center mt-8">
      <a class="hover:text-[var(--text-secondary)] underline decoration-[var(--border-subtle)] underline-offset-4"
        href="/login.html">Back to sign in</a>
      <span aria-hidden="true"> · </span>
      <a class="hover:text-[var(--text-secondary)] underline decoration-[var(--border-subtle)] underline-offset-4"
        href="/privacy.html">Privacy</a>
      <span aria-hidden="true"> · </span>
      <a class="hover:text-[var(--text-secondary)] underline decoration-[var(--border-subtle)] underline-offset-4"
        href="/terms.html">Terms</a>
    </p>
  </main>
  <script type="module" src="/assets/forgot_password.js"></script>
</body>

</html>
